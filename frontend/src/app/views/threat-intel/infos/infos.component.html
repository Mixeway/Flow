<div class="statistics-dashboard">
    <c-row class="stats-row g-3">
        <!-- Open Vulnerabilities: the number that actually carries risk -->
        <c-col sm="6" xl="3">
            <div class="stat-tile accent-danger">
                <div class="stat-icon">
                    <svg [cIcon]="icons.cilBug" width="18"></svg>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Open Vulnerabilities</div>
                    <div class="stat-value">{{ openedVulns | number }}</div>
                    <div class="stat-sub">In monitored repos</div>
                </div>
            </div>
        </c-col>

        <!-- Repositories at Risk -->
        <c-col sm="6" xl="3">
            <div class="stat-tile" [class.accent-warning]="affectedProjects > 0">
                <div class="stat-icon">
                    <svg [cIcon]="icons.cilChart" width="18"></svg>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Repos at Risk</div>
                    <div class="stat-value">{{ percentage }}<span class="stat-unit">%</span></div>
                    <div class="stat-sub">{{ affectedProjects | number }} of {{ allProjects | number }} repos affected</div>
                </div>
            </div>
        </c-col>

        <!-- Repositories Covered -->
        <c-col sm="6" xl="3">
            <div class="stat-tile">
                <div class="stat-icon">
                    <svg [cIcon]="icons.cilChartPie" width="18"></svg>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Repositories Covered</div>
                    <div class="stat-value">{{ allProjects | number }}</div>
                    <div class="stat-sub">Under active scanning</div>
                </div>
            </div>
        </c-col>

        <!-- Active Teams -->
        <c-col sm="6" xl="3">
            <div class="stat-tile">
                <div class="stat-icon">
                    <svg [cIcon]="icons.cilPeople" width="18"></svg>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Active Teams</div>
                    <div class="stat-value">{{ teams | number }}</div>
                    <div class="stat-sub">With owned repos</div>
                </div>
            </div>
        </c-col>
    </c-row>
</div>
